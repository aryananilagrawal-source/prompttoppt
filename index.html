<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Style PPT Generator (No API)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.11.0/dist/pptxgen.bundle.js"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-3xl w-full bg-white rounded-2xl shadow-2xl p-8 space-y-6">
        <div class="text-center">
            <h1 class="text-4xl font-extrabold text-gray-800 mb-2">PPT <span class="text-indigo-600">Architect</span></h1>
            <p class="text-gray-500">Generate professional presentations instantly—no API key required.</p>
        </div>

        <div class="space-y-4">
            <label class="block text-sm font-medium text-gray-700">What is your presentation about?</label>
            <textarea id="promptInput" rows="4" 
                class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
                placeholder="e.g., The Future of Renewable Energy in 2026..."></textarea>
            
            <button onclick="generatePPT()" 
                class="w-full gradient-bg text-white font-bold py-4 rounded-xl hover:opacity-90 transition transform hover:scale-[1.01] active:scale-95 shadow-lg">
                Generate Presentation (.pptx)
            </button>
        </div>

        <div id="status" class="hidden text-center text-sm font-medium text-indigo-600 animate-pulse">
            Architecting your slides...
        </div>
    </div>

    <script>
        function generatePPT() {
            const prompt = document.getElementById('promptInput').value;
            const status = document.getElementById('status');
            
            if (!prompt) {
                alert("Please enter a prompt first!");
                return;
            }

            status.classList.remove('hidden');
            
            // Initialize PptxGenJS
            let pptx = new PptxGenJS();
            pptx.layout = 'LAYOUT_16x9';

            // 1. Define Design Theme Colors
            const accentColor = '4F46E5'; // Indigo
            const textColor = '333333';
            const white = 'FFFFFF';

            // 2. Slide 1: Title Slide
            let slide1 = pptx.addSlide();
            slide1.background = { color: 'F3F4F6' };
            
            // Decorative Shape
            slide1.addShape(pptx.ShapeType.rect, { x: 0, y: 0, w: '100%', h: 0.5, fill: { color: accentColor } });
            
            slide1.addText(prompt.toUpperCase(), { 
                x: 0.5, y: 2.0, w: '90%', fontSize: 44, color: accentColor, bold: true, align: 'center' 
            });
            slide1.addText("Generated by PPT Architect", { 
                x: 0.5, y: 3.5, w: '90%', fontSize: 18, color: '666666', align: 'center', italic: true 
            });

            // 3. Slide 2: Overview (Automated Content)
            let slide2 = pptx.addSlide();
            slide2.addText("Executive Overview", { x: 0.5, y: 0.5, fontSize: 32, color: accentColor, bold: true });
            
            const points = [
                "Detailed analysis of " + prompt,
                "Key strategic milestones and objectives",
                "Implementation roadmap and future outlook",
                "Risk assessment and mitigation strategies"
            ];
            
            slide2.addText(points, { x: 0.5, y: 1.5, w: '90%', fontSize: 20, bullet: true, lineSpacing: 35 });

            // 4. Slide 3: Visual Data Slide
            let slide3 = pptx.addSlide();
            slide3.addText("Key Statistics", { x: 0.5, y: 0.5, fontSize: 32, color: accentColor, bold: true });
            
            // Add a mock chart to make it look professional
            let dataChartAreaStat = [
                {
                    name: "Projected Growth",
                    labels: ["2023", "2024", "2025", "2026"],
                    values: [10, 25, 55, 90],
                },
            ];
            slide3.addChart(pptx.ChartType.bar, dataChartAreaStat, { x: 0.5, y: 1.5, w: 8, h: 3 });

            // 5. Slide 4: Closing
            let slide4 = pptx.addSlide();
            slide4.background = { color: accentColor };
            slide4.addText("THANK YOU", { x: 0, y: 2.2, w: '100%', fontSize: 48, color: white, bold: true, align: 'center' });
            slide4.addText("Questions & Discussion", { x: 0, y: 3.2, w: '100%', fontSize: 20, color: white, align: 'center' });

            // Save the Presentation
            pptx.writeFile({ fileName: `Presentation_${new Date().getTime()}.pptx` })
                .then(file => {
                    status.classList.add('hidden');
                })
                .catch(err => {
                    console.error(err);
                    status.innerText = "Error generating file.";
                });
        }
    </script>
</body>
</html>
