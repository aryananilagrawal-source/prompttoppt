<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instant PPT Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-lg border border-slate-700">
        <h1 class="text-2xl font-bold mb-2 text-blue-400">PPT Generator (No-API)</h1>
        <p class="text-slate-400 text-sm mb-6">Enter a topic to build a structured presentation.</p>

        <input type="text" id="pptTopic" placeholder="e.g. History of Cricket" 
            class="w-full p-3 rounded bg-slate-700 border border-slate-600 mb-4 focus:outline-none focus:border-blue-500">

        <button onclick="createPowerPoint()" 
            class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded transition-all">
            Generate & Download
        </button>

        <div id="log" class="mt-4 text-xs text-slate-500 font-mono bg-black p-2 rounded hidden"></div>
    </div>

    <script>
        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.classList.remove('hidden');
            logDiv.innerHTML += "> " + msg + "<br>";
        }

        async function createPowerPoint() {
            const topic = document.getElementById('pptTopic').value;
            if (!topic) return alert("Please enter a topic!");

            log("Initializing PptxGenJS...");

            try {
                // Check if library is loaded
                if (typeof PptxGenJS === 'undefined') {
                    throw new Error("Library not loaded. Check internet connection.");
                }

                let pptx = new PptxGenJS();
                log("Setting up slides...");

                // Slide 1: Title
                let slide1 = pptx.addSlide();
                slide1.background = { color: "1E293B" }; // Dark Blue
                slide1.addText(topic.toUpperCase(), { 
                    x: 1, y: 2, w: '80%', fontSize: 40, color: "60A5FA", bold: true, align: 'center' 
                });
                slide1.addText("Prepared for Presentation", { 
                    x: 1, y: 3.5, w: '80%', fontSize: 18, color: "94A3B8", align: 'center' 
                });

                // Slide 2: Points
                log("Adding content slides...");
                let slide2 = pptx.addSlide();
                slide2.addText("Core Objectives", { x: 0.5, y: 0.5, fontSize: 28, bold: true, color: "2563EB" });
                slide2.addText(
                    [
                        { text: "Detailed analysis of " + topic, options: { bullet: true } },
                        { text: "Strategic implementation phases", options: { bullet: true } },
                        { text: "Expected outcomes and metrics", options: { bullet: true } }
                    ], 
                    { x: 0.5, y: 1.5, w: '90%', fontSize: 20 }
                );

                // Slide 3: Conclusion
                let slide3 = pptx.addSlide();
                slide3.addText("Conclusion", { x: 0.5, y: 0.5, fontSize: 28, bold: true });
                slide3.addText("Thank you for your time.", { x: 2, y: 2.5, fontSize: 24 });

                log("Attempting download...");
                await pptx.writeFile({ fileName: topic.replace(/\s+/g, '_') + ".pptx" });
                log("Done!");

            } catch (error) {
                log("ERROR: " + error.message);
                console.error(error);
            }
        }
    </script>
</body>
</html>
